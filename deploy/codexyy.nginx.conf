server {
    listen 80;
    server_name codexyy.dev www.codexyy.dev;

    location = /install {
        root /var/www/codexyy;
        default_type text/plain;
    }
    location = /codexyy.py {
        root /var/www/codexyy;
        default_type text/plain;
    }
    location = /cli/ai {
        return 301 https://$host$request_uri;
    }

    location = /cx {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name codexyy.dev www.codexyy.dev;
    ssl_certificate /etc/letsencrypt/live/codexyy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codexyy.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/codexyy;
    index index.html;

    location = /install { default_type text/plain; }
    location = /cli { default_type text/plain; }
    location = /cli/ai {
        default_type text/plain;
        try_files /cli-ai =404;
        add_header Cache-Control "no-store";
    }
    location = /pro {
        try_files /index.html =404;
    }
    location /agent-dl/ {
        default_type application/octet-stream;
        limit_req zone=codexyy_downloads burst=20 nodelay;
        limit_conn codexyy_connections 10;
    }

    location /cli-dl/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        limit_req zone=codexyy_downloads burst=20 nodelay;
        limit_conn codexyy_connections 10;
    }

    location /offline-dl/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        limit_req zone=codexyy_downloads burst=20 nodelay;
        limit_conn codexyy_connections 4;
    }
    location = /codexyy.py { default_type text/plain; }

    # The visual launcher belongs to the main SPA; the broader /agent/ prefix
    # below serves the legacy local-agent static bundle.
    location = /agent/start {
        try_files /index.html =404;
    }

    location /agent/ {
        autoindex off;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /support {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 302 /auth/support;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /relay/ {
        limit_req zone=codexyy_relays burst=5 nodelay;
        limit_conn codexyy_connections 8;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /ws/ {
        limit_req zone=codexyy_relays burst=5 nodelay;
        limit_conn codexyy_connections 8;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300;
    }

    location = /privacy {
        root /var/www/codexyy;
        try_files /privacy.html =404;
    }

    location = /openaischema {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /cxinfo {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/p/[a-z0-9]+$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    location ~ ^/t/[a-z0-9_-]+$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    # cx language routes
    location = /cxdocsweb {
        root /var/www/codexyy;
        try_files /cxdocsweb.html =404;
    }

        location = /cx {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /cx/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /cx/cx.py {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /cx/examples/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ "^/cx/[a-z0-9]{8}$" {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
