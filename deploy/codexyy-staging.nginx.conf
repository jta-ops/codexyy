limit_req_zone $binary_remote_addr zone=codexyy_staging:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name staging.codexyy.dev;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.codexyy.dev;

    ssl_certificate /etc/letsencrypt/live/staging.codexyy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.codexyy.dev/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=codexyy_staging burst=30 nodelay;
        proxy_pass http://127.0.0.1:8876;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
